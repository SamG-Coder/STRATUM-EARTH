name: Validate STRATUM EARTH and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile Earth and preserved city kernels
        run: npm run build
      - name: Coordinate, data, cache, race and legacy regression tests
        run: npm run test:source
      - name: Native exact geometry regression
        run: node tools/native-test.mjs
      - name: Install browser for portable regression
        run: npx playwright install --with-deps chromium
      - name: Minimal render diagnostics
        env:
          DEBUG: pw:browser
        run: node tools/earth-render-smoke.mjs
      - name: Browser worker, software WebGPU farm and scene regression
        env:
          CW_SOFTWARE_GPU: '1'
        run: npm run test:browser
      - name: Rendered globe pixel validation
        run: node tools/earth-pixel-test.mjs
      - name: Package Earth and legacy city
        run: npm run pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-validation-${{ github.sha }}
          path: reports/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
