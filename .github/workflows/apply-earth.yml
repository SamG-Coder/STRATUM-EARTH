name: Apply and validate Earth implementation
# One-time source transport on the isolated implementation branch. CI writes
# source only. Workflow changes/removal are made through the authorized connector.
on:
  push:
    branches: [feature/geospatial-earth-foundation]
    paths: ['.earth-patch-*.b64', '.github/workflows/apply-earth.yml']
permissions:
  contents: write
jobs:
  implement:
    if: github.repository == 'SamG-Coder/STRATUM-EARTH' && github.ref == 'refs/heads/feature/geospatial-earth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact source changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import fs from 'node:fs'; import zlib from 'node:zlib'; const b=[1,2,3,4].map(i=>fs.readFileSync('.earth-patch-'+i+'.b64','utf8')).join(''); fs.writeFileSync(process.env.RUNNER_TEMP+'/earth.patch',zlib.brotliDecompressSync(Buffer.from(b,'base64')));"
          echo "c6ff7b4c33521100054d051039f79b2df6d1138fbcaeb8cedadeeb5c974b8193  $RUNNER_TEMP/earth.patch" | sha256sum -c -
          git apply --check --exclude='.github/workflows/*' "$RUNNER_TEMP/earth.patch"
          git apply --exclude='.github/workflows/*' "$RUNNER_TEMP/earth.patch"
          git diff --exit-code -- kernels vendor/cuda-webshader .github/workflows
          git rm .earth-patch-1.b64 .earth-patch-2.b64 .earth-patch-3.b64 .earth-patch-4.b64
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement WGS84 Earth geography streaming and CUDA detail farm'
          git push origin HEAD:refs/heads/feature/geospatial-earth-foundation
      - run: npm ci
      - name: Compile legacy and Earth CUDA programs
        run: npm run build
      - name: Coordinate, geography, cache and cancellation regression
        run: npm run test:source
      - name: Original exact-geometry regression
        run: node tools/native-test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Real browser and software WebGPU regression
        env:
          CW_SOFTWARE_GPU: '1'
        run: npm run test:browser
      - name: Package GitHub Pages
        run: npm run pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-implementation-validation
          path: reports/earth-*
          retention-days: 14
